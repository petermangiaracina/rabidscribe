  <style>
    :root{--plum:#382b35;--plum-light:#5b4655;--paper:#f3ead8;--ink:#302924;--muted:#7e6d63;--gold:#b78d5a;--shadow:rgba(15,10,13,.42)}*{box-sizing:border-box}html{background:var(--plum);scroll-behavior:smooth}body{margin:0;min-height:100vh;color:#f4ede8;background:radial-gradient(circle at 50% 12%,#684f61 0,var(--plum-light) 34%,var(--plum) 100%);font-family:Georgia,'Times New Roman',serif}button,a{font:inherit}.reader-shell{width:min(1240px,calc(100% - 32px));margin:0 auto;padding:24px 0 40px}.reader-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;font-family:Arial,Helvetica,sans-serif}.back{color:#e7d9dc;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-decoration:none;text-transform:uppercase;border-bottom:1px solid rgba(231,217,220,.55);padding-bottom:4px}.byline{margin:0;color:#d6c6cb;font-size:.72rem;letter-spacing:.17em;text-transform:uppercase}.book-stage{display:grid;place-items:center;min-height:calc(100vh - 155px)}.book{position:relative;width:100%;perspective:1800px}.cover-view{width:min(430px,88vw);margin:0 auto;filter:drop-shadow(0 28px 30px var(--shadow))}.cover{position:relative;aspect-ratio:2/3;overflow:hidden;background:#2b201e;border:1px solid rgba(255,255,255,.16);box-shadow:inset 9px 0 15px rgba(0,0,0,.28)}.cover img{display:block;width:100%;height:100%;object-fit:cover}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.4),transparent 9%,transparent 70%,rgba(0,0,0,.16)),linear-gradient(180deg,rgba(19,20,31,.55),transparent 46%,rgba(19,20,31,.18))}.cover-copy{position:absolute;z-index:1;inset:0;padding:11% 9%;display:flex;flex-direction:column;align-items:center;text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.9)}.cover-kicker{margin:0 0 6%;font-family:Arial,Helvetica,sans-serif;font-size:clamp(.62rem,1.6vw,.78rem);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#efd6ad}.cover h1{max-width:370px;margin:0;color:#fff5df;font-size:clamp(2rem,6.2vw,3.15rem);font-weight:500;line-height:.98}.cover-author{margin:auto 0 0;font-family:Arial,Helvetica,sans-serif;font-size:clamp(.7rem,1.8vw,.9rem);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#fff5df}.open-book{display:block;margin:22px auto 0;padding:10px 0 7px;color:#f7eeea;background:none;border:0;border-bottom:1px solid var(--gold);font-family:Arial,Helvetica,sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}.spread-view{display:none}.book.is-open .cover-view{display:none}.book.is-open .spread-view{display:block;animation:reveal .42s ease both}@keyframes reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.spread{position:relative;display:grid;grid-template-columns:1fr 1fr;max-width:1160px;margin:0 auto;background:var(--paper);color:var(--ink);box-shadow:0 30px 55px var(--shadow),0 1px 0 rgba(255,255,255,.4) inset}.spread:before{content:"";position:absolute;z-index:2;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(71,51,40,.14) 42%,rgba(71,51,40,.2) 50%,rgba(255,255,255,.28) 57%,transparent)}.page{position:relative;min-height:690px;padding:58px 64px 54px;background:linear-gradient(90deg,var(--paper),#f6eedf 96%);overflow:hidden}.page[hidden]{display:none!important}.page:nth-child(even){background:linear-gradient(90deg,#f6eedf 4%,var(--paper))}.page-inner{max-width:490px;margin:0 auto}.page p{margin:0 0 1em;font-size:clamp(.92rem,1.25vw,1.04rem);line-height:1.55}.page .lead:first-letter{float:left;margin:.06em .1em 0 0;color:#785043;font-size:3.5em;line-height:.75}.note{color:var(--muted);font-style:italic}.folio{position:absolute;bottom:22px;left:0;width:100%;text-align:center;color:#8b796d;font-family:Arial,Helvetica,sans-serif;font-size:.66rem;letter-spacing:.12em}.reader-controls{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:24px;font-family:Arial,Helvetica,sans-serif}.nav-button{min-width:112px;padding:9px 14px;color:#f3e9e5;background:transparent;border:1px solid rgba(243,233,229,.38);font-size:.7rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}.nav-button:disabled{opacity:.35;cursor:default}.progress{min-width:120px;margin:0;color:#d8c9ce;font-size:.68rem;letter-spacing:.12em;text-align:center;text-transform:uppercase}.hint{margin:12px 0 0;color:#baaab0;font-family:Arial,Helvetica,sans-serif;font-size:.66rem;letter-spacing:.08em;text-align:center}.screen-reader-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}:focus-visible{outline:2px solid #e7bb7d;outline-offset:5px}@media(max-width:900px){.page{min-height:650px;padding:46px 42px 50px}.page p{font-size:.92rem;line-height:1.5}}@media(max-width:700px){.reader-shell{width:min(100% - 22px,620px);padding-top:16px}.reader-bar{margin-bottom:18px}.byline{display:none}.book-stage{min-height:0}.spread{display:block}.spread:before{display:none}.page{display:none;min-height:calc(100vh - 190px);padding:38px 30px 52px;background:linear-gradient(90deg,var(--paper),#f6eedf 96%)}.page.is-mobile-page{display:block}.page p{font-size:clamp(.94rem,3.7vw,1.04rem);line-height:1.58}.reader-controls{gap:12px}.nav-button{min-width:90px}.hint{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

  <main class="reader-shell"><nav class="reader-bar" aria-label="Story navigation"><a class="back" href="free-reads.html">← Free Reads</a><p class="byline">A free read by Peter Mangiaracina</p></nav><div class="book-stage"><article class="book" id="book"><div class="cover-view"><div class="cover"><img src="the-humongous-christmas-tree-massacre-cover.jpg" alt="Three teenagers beside an enormous evergreen by a parkway at night"><div class="cover-copy"><p class="cover-kicker">A Free Read</p><h1>The Humongous Christmas Tree Massacre</h1><p class="cover-author">Peter Mangiaracina</p></div></div><button class="open-book" id="openBook" type="button">Open Book</button></div><div class="spread-view"><div class="spread" id="spread" aria-live="polite"></div><div class="reader-controls"><button class="nav-button" id="previous" type="button">Previous</button><p class="progress" id="progress">Loading story</p><button class="nav-button" id="next" type="button">Next</button></div><p class="hint">Use the arrow keys or swipe to turn pages</p></div></article></div><p class="screen-reader-only" id="announcement" aria-live="polite"></p></main>
  <script>
    (() => {const book=document.getElementById('book'),openButton=document.getElementById('openBook'),previous=document.getElementById('previous'),next=document.getElementById('next'),progress=document.getElementById('progress'),announcement=document.getElementById('announcement'),spread=document.getElementById('spread'),phone=window.matchMedia('(max-width:700px)');let pages=[],current=0,touchStart=0,ready=false;const step=()=>phone.matches?1:2;const lastStart=()=>phone.matches?pages.length-1:Math.max(0,pages.length-2);function showPages(){if(!ready)return;current=Math.min(Math.max(0,current),lastStart());if(!phone.matches&&current%2)current--;pages.forEach((page,index)=>{const visible=index>=current&&index<current+step();page.hidden=!visible;page.classList.toggle('is-mobile-page',visible&&phone.matches)});const first=current+1,last=Math.min(current+step(),pages.length);progress.textContent=first===last?`Page ${first} of ${pages.length}`:`Pages ${first}–${last} of ${pages.length}`;announcement.textContent=progress.textContent;previous.disabled=current===0;next.disabled=current>=lastStart()}function addPage(paragraphs,number){const section=document.createElement('section');section.className='page';section.dataset.page=number;const inner=document.createElement('div');inner.className='page-inner';paragraphs.forEach(({text,first,note})=>{const p=document.createElement('p');p.textContent=text;if(first)p.className='lead';if(note)p.className='note';inner.appendChild(p)});const folio=document.createElement('span');folio.className='folio';folio.textContent=number;section.append(inner,folio);spread.appendChild(section);pages.push(section)}function build(text){const lines=text.replace(/\r/g,'').trim().split('\n');lines.shift();const note=lines.shift().trim();const paragraphs=lines.join('\n').split(/\n\s*\n/).map(p=>p.replace(/\n+/g,' ').replace(/[￼]/g,'').trim()).filter(Boolean);const pieces=[];paragraphs.forEach(p=>{if(p.length<1050){pieces.push(p);return}const sentences=p.match(/[^.!?]+(?:[.!?]+[”']?|$)/g)||[p];let part='';sentences.forEach(s=>{if(part&&part.length+s.length>850){pieces.push(part.trim());part=''}part+=s});if(part)pieces.push(part.trim())});let bundle=[],count=0,first=true;bundle.push({text:note,note:true});count+=note.length;pieces.forEach(textPart=>{if(bundle.length>1&&count+textPart.length>1250){addPage(bundle,pages.length+1);bundle=[];count=0}bundle.push({text:textPart,first});first=false;count+=textPart.length});if(bundle.length)addPage(bundle,pages.length+1);ready=true;showPages()}fetch('the-humongous-christmas-tree-massacre.txt').then(response=>{if(!response.ok)throw new Error('Story unavailable');return response.text()}).then(build).catch(()=>{addPage([{text:'The story could not be loaded. Please return to Free Reads and try again.',note:true}],1);ready=true;showPages()});function turn(direction){current+=direction*step();showPages()}openButton.addEventListener('click',()=>{book.classList.add('is-open');showPages();next.focus()});previous.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));document.addEventListener('keydown',event=>{if(!book.classList.contains('is-open'))return;if(event.key==='ArrowRight')turn(1);if(event.key==='ArrowLeft')turn(-1)});book.addEventListener('touchstart',event=>{touchStart=event.changedTouches[0].clientX},{passive:true});book.addEventListener('touchend',event=>{const distance=event.changedTouches[0].clientX-touchStart;if(Math.abs(distance)>55)turn(distance<0?1:-1)});phone.addEventListener('change',showPages)})();
  </script>
