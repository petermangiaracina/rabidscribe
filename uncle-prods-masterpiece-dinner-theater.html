<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Read and hear Uncle Prod’s Masterpiece Dinner Theater by Peter Mangiaracina."><title>Uncle Prod’s Masterpiece Dinner Theater | Peter Mangiaracina</title><style>:root{--ink:#352832;--paper:#f5eee6;--muted:#75616b;--accent:#a96451;--line:#ddcec3}*{box-sizing:border-box}body{margin:0;background:#342833;color:#f5eee6;font-family:Georgia,'Times New Roman',serif}.shell{width:min(1160px,calc(100% - 32px));margin:auto}.bar{display:flex;justify-content:space-between;gap:20px;padding:28px 0;color:#dfcfc8;font:700 .72rem Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}.bar a{color:#fff;text-decoration:none;border-bottom:1px solid #d1a685;padding-bottom:5px}.cover-view{display:grid;place-items:center;min-height:calc(100vh - 90px)}.cover{position:relative;width:min(100%,650px);aspect-ratio:2/3;overflow:hidden;box-shadow:0 24px 58px #110b1099}.cover img{width:100%;height:100%;object-fit:cover}.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(#17070c99 0%,transparent 45%,#16080cd9 100%)}.title{position:absolute;z-index:1;inset:9% 9% auto;text-align:center;text-shadow:0 2px 14px #000}.title p{margin:0;font:700 .7rem Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.title h1{font-size:clamp(2.25rem,7vw,4.8rem);font-weight:400;line-height:.96;margin:.75rem 0}.title .author{font-size:1rem;letter-spacing:.08em;text-transform:none}.open{position:absolute;z-index:2;bottom:7%;left:50%;transform:translateX(-50%);padding:14px 22px;background:#f5eee6;color:#342833;border:0;font:700 .75rem Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}.reader{display:none;padding:34px 0 70px}.reader.open{display:block}.notice{max-width:760px;margin:0 auto 24px;padding:18px 20px;border:1px solid #d1a685;background:#43333f;color:#f4ece5;line-height:1.5}.notice strong{ r Mangiaracina</p></div><button class="open" id="open" type="button">Open Book</button></article></section><section class="reader" id="reader"><div class="notice"><strong>Sensitive material</strong><br>Contains sexual humor, crude language, and satirical references.</div><div class="audio"><p>Listen to the original radio performance</p><audio controls preload="metadata"><source src="uncle-prods-masterpiece-dinner-theater.mp3" type="audio/mpeg">Your browser does not support embedded audio. <a href="uncle-prods-masterpiece-dinner-theater.mp3">Download the MP3</a>.</audio></div><div class="book"><div class="pages" id="pages"></div></div><div class="controls"><button id="prev" type="button">Previous</button><p id="progress"></p><button id="next" type="button">Next</button></div></section></main><script>const pagesEl=document.getElementById('pages'),reader=document.getElementById('reader'),open=document.getElementById('open'),prev=document.getElementById('prev'),next=document.getElementById('next'),progress=document.getElementById('progress');let pages=[],at=0;function step(){return matchMedia('(min-width:820px)').matches?2:1}function show(){let s=step();at=Math.max(0,Math.min(at,pages.length-s));if(s===2)at-=at%2;pages.forEach((p,i)=>p.classList.toggle('show',i>=at&&i<at+s));progress.textContent=s===2?`Pages ${at+1}–${Math.min(at+2,pages.length)} of ${pages.length}`:`Page ${at+1} of ${pages.length}`;prev.disabled=at===0;next.disabled=at>=pages.length-s}fetch('uncle-prods-masterpiece-dinner-theater.txt').then(r=>r.text()).then(t=>{let blocks=t.trim().split(/\n\s*\n/).filter(x=>x.trim()&&!/^PAGE/.test(x.trim()));let groups=[];for(let i=0;i<blocks.length;i+=3)groups.push(blocks.slice(i,i+3));pages=groups.map((g,i)=>{let e=document.createElement('section');e.className='page';e.innerHTML=g.map(x=>`<p>${x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/^\[.*\]$/gm,'<span class="stage">$&</span>')}</p>`).join('')+`<span class="folio">${i+1}</span>`;pagesEl.append(e);return e});show()});open.onclick=()=>{document.getElementById('cover').hidden=true;reader.classList.add('open');show();window.scrollTo({top:0,behavior:'smooth'})};prev.onclick=()=>{at-=step();show()};next.onclick=()=>{at+=step();show()};addEventListener('resize',show);addEventListener('keydown',e=>{if(!reader.classList.contains('open'))return;if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});</script></body></html>
