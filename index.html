<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #111;
      color: #f4f1ea;
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
      padding: 2rem;
    }
    main { max-width: 760px; }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: .95;
      letter-spacing: .02em;
    }
    .author {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1rem, 3vw, 1.35rem);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .coming {
      margin: 2.5rem 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: .85rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      opacity: .65;
    }
  </style>
</head>
<body>
  <main>
    <h1>Rabid Scribe</h1>
    <p class="author">Author website of Peter Mangiaracina</p>
    <p class="coming">Coming Soon</p>

</html>
